name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  docker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build containers
        run: docker compose build

      - name: Run type checks
        run: docker compose run --rm api npm run typecheck

      - name: Run production builds
        run: docker compose run --rm api npm run build

      - name: Start application
        run: docker compose up --detach --wait

      - name: Check API
        run: curl --fail http://localhost:3000/api/health

      - name: Check web application
        run: curl --fail http://localhost:5173

      - name: Stop application
        if: always()
        run: docker compose down --volumes
